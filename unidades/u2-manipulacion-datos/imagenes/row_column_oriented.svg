<svg viewBox="0 0 1020 460" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="1020" height="460" fill="#ffffff"/>

  <text x="510" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a2e">Almacenamiento orientado a filas vs. orientado a columnas</text>
  <text x="510" y="48" font-size="13" text-anchor="middle" fill="#555">Mismo dataset, dos formas de organizarlo físicamente</text>

  <!-- ROW ORIENTED -->
  <text x="510" y="88" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a4d6d">Orientado a filas (row-oriented)</text>

  <!-- Fila 1 -->
  <rect x="54" y="110" width="304" height="60" rx="6" fill="none" stroke="#45a4b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="60" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="95" y="144" font-size="10" text-anchor="middle">40576890</text>
  <rect x="134" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="169" y="144" font-size="11" text-anchor="middle">Pedro</text>
  <rect x="208" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="243" y="144" font-size="11" text-anchor="middle">Aguirre</text>
  <rect x="282" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="317" y="144" font-size="11" text-anchor="middle">1995</text>
  <text x="206" y="185" font-size="12" text-anchor="middle" fill="#1a4d6d">fila 1</text>

  <!-- Fila 2 -->
  <rect x="362" y="110" width="304" height="60" rx="6" fill="none" stroke="#45a4b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="368" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="403" y="144" font-size="10" text-anchor="middle">32492645</text>
  <rect x="442" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="477" y="144" font-size="11" text-anchor="middle">Julia</text>
  <rect x="516" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="551" y="144" font-size="11" text-anchor="middle">Martinez</text>
  <rect x="590" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="625" y="144" font-size="11" text-anchor="middle">1988</text>
  <text x="514" y="185" font-size="12" text-anchor="middle" fill="#1a4d6d">fila 2</text>

  <!-- Fila 3 -->
  <rect x="670" y="110" width="304" height="60" rx="6" fill="none" stroke="#45a4b0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="676" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="711" y="144" font-size="10" text-anchor="middle">30298710</text>
  <rect x="750" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="785" y="144" font-size="11" text-anchor="middle">Camila</text>
  <rect x="824" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="859" y="144" font-size="11" text-anchor="middle">Suarez</text>
  <rect x="898" y="118" width="70" height="44" fill="#ffffff" stroke="#45a4b0"/>
  <text x="933" y="144" font-size="11" text-anchor="middle">1985</text>
  <text x="822" y="185" font-size="12" text-anchor="middle" fill="#1a4d6d">fila 3</text>

  <text x="510" y="205" font-size="12" text-anchor="middle" fill="#444" font-style="italic">cada fila se guarda de forma contigua en memoria</text>

  <line x1="40" y1="222" x2="980" y2="222" stroke="#dddddd" stroke-width="1"/>

  <!-- COLUMN ORIENTED -->
  <text x="510" y="250" font-size="15" font-weight="bold" text-anchor="middle" fill="#7a4a00">Orientado a columnas (column-oriented)</text>

  <!-- dni -->
  <rect x="54" y="270" width="230" height="60" rx="6" fill="none" stroke="#5b8fb0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="60" y="278" width="70" height="44" fill="#cfe3f3" stroke="#5b8fb0"/>
  <text x="95" y="304" font-size="10" text-anchor="middle">40576890</text>
  <rect x="134" y="278" width="70" height="44" fill="#cfe3f3" stroke="#5b8fb0"/>
  <text x="169" y="304" font-size="10" text-anchor="middle">32492645</text>
  <rect x="208" y="278" width="70" height="44" fill="#cfe3f3" stroke="#5b8fb0"/>
  <text x="243" y="304" font-size="10" text-anchor="middle">30298710</text>
  <text x="169" y="345" font-size="12" text-anchor="middle" fill="#1a4d6d">columna dni</text>

  <!-- nombre -->
  <rect x="288" y="270" width="230" height="60" rx="6" fill="none" stroke="#c98a2a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="294" y="278" width="70" height="44" fill="#ffdca8" stroke="#c98a2a"/>
  <text x="329" y="304" font-size="11" text-anchor="middle">Pedro</text>
  <rect x="368" y="278" width="70" height="44" fill="#ffdca8" stroke="#c98a2a"/>
  <text x="403" y="304" font-size="11" text-anchor="middle">Julia</text>
  <rect x="442" y="278" width="70" height="44" fill="#ffdca8" stroke="#c98a2a"/>
  <text x="477" y="304" font-size="11" text-anchor="middle">Camila</text>
  <text x="403" y="345" font-size="12" text-anchor="middle" fill="#7a4a00">columna nombre</text>

  <!-- apellido -->
  <rect x="522" y="270" width="230" height="60" rx="6" fill="none" stroke="#4a9a4a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="528" y="278" width="70" height="44" fill="#d7f0d7" stroke="#4a9a4a"/>
  <text x="563" y="304" font-size="11" text-anchor="middle">Aguirre</text>
  <rect x="602" y="278" width="70" height="44" fill="#d7f0d7" stroke="#4a9a4a"/>
  <text x="637" y="304" font-size="11" text-anchor="middle">Martinez</text>
  <rect x="676" y="278" width="70" height="44" fill="#d7f0d7" stroke="#4a9a4a"/>
  <text x="711" y="304" font-size="11" text-anchor="middle">Suarez</text>
  <text x="637" y="345" font-size="12" text-anchor="middle" fill="#2f6d2f">columna apellido</text>

  <!-- anio -->
  <rect x="756" y="270" width="230" height="60" rx="6" fill="none" stroke="#a35bb0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="762" y="278" width="70" height="44" fill="#eed6f2" stroke="#a35bb0"/>
  <text x="797" y="304" font-size="11" text-anchor="middle">1995</text>
  <rect x="836" y="278" width="70" height="44" fill="#eed6f2" stroke="#a35bb0"/>
  <text x="871" y="304" font-size="11" text-anchor="middle">1988</text>
  <rect x="910" y="278" width="70" height="44" fill="#eed6f2" stroke="#a35bb0"/>
  <text x="945" y="304" font-size="11" text-anchor="middle">1985</text>
  <text x="871" y="345" font-size="12" text-anchor="middle" fill="#7a3d84">columna año_nacimiento</text>

  <text x="510" y="368" font-size="12" text-anchor="middle" fill="#444" font-style="italic">cada columna se guarda de forma contigua en memoria</text>

  <line x1="40" y1="382" x2="980" y2="382" stroke="#dddddd" stroke-width="1"/>

  <text x="510" y="410" font-size="13" text-anchor="middle" fill="#333">Leer un registro completo → conviene el formato orientado a filas</text>
  <text x="510" y="432" font-size="13" text-anchor="middle" fill="#333">Leer una columna para todos los registros → conviene el formato orientado a columnas</text>
</svg>
